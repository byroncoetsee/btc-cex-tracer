manifestVersion: 1
id: doxd
category: bitcoin
name: DOXd
version: "1.0.0"
tagline: Trace whether your Bitcoin addresses link back to exchanges
description: >-
  DOXd is a chain-analysis tool that traces whether your addresses can be
  linked back to centralized exchanges (CEXs). It walks the transaction graph
  outward from your addresses (or xpub-derived addresses), detects same-entity
  address clusters using the Common-Input-Ownership Heuristic, and scores how
  exposed each address is — all through a retro terminal-style interface.


  It connects directly to your Umbrel's bundled Electrs node, so on-chain
  queries never leave your device. All trace results are stored locally in your
  browser — no server database, no accounts, no cloud sync.


  Features:

  - Xpub address derivation (BIP44/49/84/86)

  - On-chain path tracing 2–6 hops deep with live streaming progress

  - CIOH clustering to detect same-entity wallets

  - 8-level obscurity risk scoring from 6 weighted factors

  - Pre-loaded CEX address databases (memory-efficient Bloom filter)

  - Interactive force-directed connection graph

  - Live block height, fee estimates, and mempool pressure
