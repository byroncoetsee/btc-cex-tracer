version: "3.7"

services:
  # Umbrel's reverse proxy — exposes the app on the dashboard.
  app_proxy:
    environment:
      APP_HOST: doxd_web_1
      APP_PORT: 3000

  web:
    # Build & push this image, then pin a tagged digest before submitting to
    # the Umbrel App Store (the store does not build from source).
    image: byroncoetsee/doxd:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Auto-connect to Umbrel's bundled Electrs node (declared as a dependency
      # in umbrel-app.yml). These vars are injected by the Umbrel app runtime.
      DEFAULT_NODE: "${APP_ELECTRS_NODE_IP}:${APP_ELECTRS_NODE_PORT}"
      DEFAULT_NODE_TLS: "false"
      NODE_ENV: production
