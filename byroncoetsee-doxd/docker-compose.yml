version: "3.7"

services:
  # Umbrel's reverse proxy — exposes the app on the dashboard.
  app_proxy:
    environment:
      APP_HOST: byroncoetsee-doxd_web_1
      APP_PORT: 3000

  web:
    # Published to GHCR by .github/workflows/docker-publish.yml on every push to
    # main (image name = the repo, tag = the branch). The package must be set
    # Public on GitHub so Umbrel can pull it anonymously.
    image: ghcr.io/byroncoetsee/btc-cex-tracer:main
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Auto-connect to Umbrel's bundled Electrs node (declared as a dependency
      # in umbrel-app.yml). These vars are injected by the Umbrel app runtime.
      DEFAULT_NODE: "${APP_ELECTRS_NODE_IP}:${APP_ELECTRS_NODE_PORT}"
      DEFAULT_NODE_TLS: "false"
      NODE_ENV: production
